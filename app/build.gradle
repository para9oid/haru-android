plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.daylight'
    compileSdk 35
    defaultConfig {
        applicationId 'com.example.daylight'
        minSdk 26
        targetSdk 34
        versionCode 12
        versionName '1.0'
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.18.0'
}
